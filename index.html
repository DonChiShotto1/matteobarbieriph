<style>
/* Layout: an editorial archive, the way working music photographers present work — an index of shows, each opening as its own sequence of large frames on black. Type stays small and quiet; the photographs carry the page. Single dark look on purpose. */
:root{
  --ink:#0a0a0a;       /* page black */
  --panel:#141414;
  --hair:#262626;
  --paper:#ecebe8;     /* text */
  --mute:#8a8986;      /* captions */
  --signal:#e11322;    /* logo red, used only as a pinpoint */
  --serif:"Instrument Serif","Times New Roman",Georgia,serif;
  --sans:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --brand:"Anton","Impact","Arial Narrow",sans-serif;
  --gut:clamp(16px,3.2vw,48px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--ink)}
body{background:var(--ink);color:var(--paper);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--paper);outline-offset:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wrap{padding-inline:var(--gut);max-width:1760px;margin-inline:auto}
.small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--ink) 60%,rgba(10,10,10,0))}
.top .wrap{display:flex;align-items:center;gap:24px;padding-block:20px 26px}
.top .logo{font:400 26px/1 var(--brand);letter-spacing:.01em;display:flex;align-items:center;gap:.28em;white-space:nowrap}.top .logo i{display:inline-block;width:.2em;height:.62em;background:var(--signal)}
.nav{margin-left:auto;display:flex;gap:28px;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.nav a{color:var(--mute);transition:color .2s}
.nav a:hover,.nav a[aria-current="page"]{color:var(--paper)}
@media (max-width:560px){.top .wrap{flex-wrap:wrap;gap:10px 16px;padding-block:14px 18px}.top .logo{font-size:22px}.nav{margin-left:0;width:100%;gap:18px;font-size:11px}}

/* views */
.view{animation:fade .45s ease}
@keyframes fade{from{opacity:.0}to{opacity:1}}

/* home: opening frame */
.open{position:relative;margin-bottom:clamp(56px,8vw,120px)}
.open button{display:block;width:100%;cursor:pointer}
.open{margin-inline:calc(var(--gut)*-1)}.open img{display:block;width:100%;height:clamp(320px,62vw,880px);object-fit:cover;object-position:50% 45%}.open .cap{padding-inline:var(--gut)}
.sec{margin-top:clamp(64px,9vw,130px)}
.open .cap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:12px}

/* index */
.index-h{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--hair);margin-bottom:28px}
.index-h h2{font:400 clamp(34px,4vw,56px)/1 var(--serif);margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(28px,3vw,48px) clamp(14px,1.6vw,24px)}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.card{display:block;text-align:left}
.card .ph{aspect-ratio:4/5;overflow:hidden;background:var(--panel)}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.1s cubic-bezier(.2,.7,.2,1),filter .5s}
.card:hover img{transform:scale(1.035)}
.card .t{display:flex;justify-content:space-between;gap:12px;padding-top:12px;align-items:baseline}
.card .t b{font:400 26px/1.05 var(--serif)}
.card .t span{font-size:12px;color:var(--mute);letter-spacing:.06em;white-space:nowrap}
.card .p{font-size:13px;color:var(--mute);margin-top:4px}

/* series */
.s-head{padding-block:clamp(24px,6vw,80px) clamp(36px,5vw,64px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}
.s-head h1{font:400 clamp(52px,10vw,168px)/.9 var(--serif);margin:0;letter-spacing:-.01em;text-wrap:balance}
.s-head .meta{text-align:right;display:flex;flex-direction:column;gap:6px}
.s-head .meta .p{font-size:14px}
.s-head .meta .n{font-size:12px;color:var(--mute);letter-spacing:.08em}
@media (max-width:760px){.s-head{grid-template-columns:1fr}.s-head .meta{text-align:left}}
.seq{display:flex;flex-direction:column;align-items:center;gap:clamp(48px,8vw,120px)}
.seq figure{margin:0;width:100%;display:flex;flex-direction:column;align-items:center}
.seq figure.l img{width:100%;max-width:1500px;height:auto}
.seq figure.p img{height:auto;max-height:92vh;width:auto;max-width:100%}
.seq figure.pair{flex-direction:row;gap:clamp(12px,2vw,28px);justify-content:center;align-items:flex-start;max-width:1500px}
.seq figure.pair button{flex:1 1 0;min-width:0}
.seq figure.pair img{width:100%;height:auto;max-height:none}
.seq img{display:block;cursor:zoom-in;background:var(--panel)}
.seq figcaption{align-self:flex-start;margin-top:10px;font-size:12px;color:var(--mute);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.seq figure.p figcaption{align-self:center}
@media (max-width:560px){.seq figure.pair{flex-direction:column}}
.s-nav{display:grid;grid-template-columns:1fr 1fr;gap:16px;border-top:1px solid var(--hair);margin-top:clamp(64px,9vw,140px);padding-top:24px}
.s-nav a{display:flex;flex-direction:column;gap:6px}
.s-nav a:last-child{text-align:right;align-items:flex-end}
.s-nav b{font:400 clamp(28px,4vw,52px)/1 var(--serif);transition:color .2s}
.s-nav a:hover b{color:var(--mute)}
.back{display:inline-block;margin-top:28px}

/* info */
.info{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(32px,6vw,110px);padding-block:clamp(24px,6vw,80px) 40px}
.info h1{font:400 clamp(48px,7vw,112px)/.92 var(--serif);margin:0 0 28px}
.info p.en{font-size:15px;color:var(--mute)}
.info p{max-width:58ch;color:#c9c8c4;font-size:17px;line-height:1.65;margin:0 0 18px}
.info .img img{width:100%;height:auto;display:block}
.info .img .small{margin-top:10px}
.facts{margin-top:40px;display:grid;gap:0;border-top:1px solid var(--hair)}
.facts div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;padding-block:14px;border-bottom:1px solid var(--hair)}
.facts dt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding-top:3px}
.facts dd{margin:0;font-size:15px}
.facts dd a{border-bottom:1px solid var(--hair)}
.facts dd a:hover{border-color:var(--paper)}
.copy{font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--hair);padding:5px 8px;margin-left:10px;color:var(--mute)}
.copy:hover{color:var(--paper);border-color:var(--paper)}
@media (max-width:860px){.info{grid-template-columns:1fr}.facts div{grid-template-columns:1fr;gap:2px}}

.fab{position:fixed;right:18px;bottom:18px;z-index:40;display:flex;gap:8px;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--ink) 82%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--hair)}
.fab a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--paper);transition:background .2s,color .2s}
.fab a:hover{background:var(--paper);color:var(--ink)}.fab a.wa:hover{background:var(--signal);color:#fff}
.fab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.fab svg .f{fill:currentColor;stroke:none}
@media (max-width:560px){.fab{right:12px;bottom:12px}.fab a{width:42px;height:42px}}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-block:72px 32px;font-size:12px;color:var(--mute);letter-spacing:.04em}
footer a:hover{color:var(--paper)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--signal);margin-right:8px;vertical-align:1px}


/* servizi */
.sv-h{padding-block:clamp(40px,7vw,96px) clamp(24px,4vw,48px);max-width:900px}
.sv-h h1{font:400 clamp(44px,7vw,96px)/.95 var(--serif);margin:0 0 20px}
.sv-h p{font-size:clamp(17px,1.6vw,20px);line-height:1.5;color:var(--paper);max-width:60ch;margin:0}
.sv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair)}
.sv{background:var(--ink);padding:clamp(22px,3vw,40px);display:flex;flex-direction:column;gap:14px}
.sv .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal)}
.sv h3{font:400 clamp(26px,2.6vw,36px)/1.05 var(--serif);margin:0}
.sv p{margin:0;color:var(--mute);line-height:1.55}
.sv ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:7px;font-size:15px}
.sv li{padding-left:18px;position:relative}.sv li:before{content:"";position:absolute;left:0;top:.62em;width:8px;height:1px;background:var(--paper)}
.sv a.go{margin-top:auto;padding-top:12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.sv a.go:hover{color:var(--signal)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,3vw,40px);margin-top:clamp(56px,8vw,110px)}
.steps div{border-top:1px solid var(--paper);padding-top:16px}
.steps b{display:block;font:400 28px/1 var(--serif);margin-bottom:10px}
.steps span{color:var(--mute);line-height:1.55}
.cred{margin-top:clamp(56px,8vw,110px);display:grid;grid-template-columns:220px minmax(0,1fr);gap:0 32px}
.cred h2{font:400 clamp(30px,3.4vw,46px)/1 var(--serif);margin:0 0 28px;grid-column:1/-1}
.cred dt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:16px 0;border-top:1px solid var(--hair)}
.cred dd{margin:0;padding:14px 0;border-top:1px solid var(--hair);font:400 clamp(18px,1.8vw,24px)/1.4 var(--serif)}
.cred dd a{border-bottom:1px solid var(--hair)}.cred dd a:hover{border-color:var(--paper)}
.cta{margin-top:clamp(56px,8vw,110px);display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;border-top:1px solid var(--hair);padding-top:32px}
.cta b{font:400 clamp(32px,4.4vw,60px)/1 var(--serif);max-width:16ch}
.btn{display:inline-flex;align-items:center;gap:12px;background:var(--paper);color:var(--ink);padding:16px 26px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;transition:background .2s,color .2s;border:0;cursor:pointer}
.btn:hover{background:var(--signal);color:#fff}
@media (max-width:860px){.sv-grid,.steps{grid-template-columns:1fr}.cred{grid-template-columns:1fr}.cred dd{border-top:0;padding-top:0}}
/* form */
.req{margin-top:clamp(56px,8vw,110px);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,80px);border-top:1px solid var(--hair);padding-top:clamp(32px,5vw,56px)}
.req h2{font:400 clamp(34px,4.6vw,64px)/.98 var(--serif);margin:0 0 16px}
.req .lead{color:var(--mute);line-height:1.6;max-width:40ch}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:22px 24px}
.fm label{display:flex;flex-direction:column;gap:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.fm .w{grid-column:1/-1}
.fm input,.fm select,.fm textarea{font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:var(--paper);background:transparent;border:0;border-bottom:1px solid #3a3a3a;padding:10px 0;border-radius:0;outline:none;transition:border-color .2s}
.fm select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(-45deg,transparent 50%,var(--mute) 50%);background-position:calc(100% - 10px) 55%,calc(100% - 5px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.fm select option{background:#111;color:#eee}
.fm textarea{min-height:110px;resize:vertical}
.fm input,.fm select{color-scheme:dark}
.fm input:focus,.fm select:focus,.fm textarea:focus{border-color:var(--paper)}
.fm input::placeholder,.fm textarea::placeholder{color:#555}
.fm .chips{display:flex;flex-wrap:wrap;gap:8px}
.fm .chips label{flex-direction:row;align-items:center;gap:0;font-size:13px;letter-spacing:.02em;text-transform:none;color:var(--paper)}
.fm .chips input{position:absolute;opacity:0;width:1px;height:1px}
.fm .chips span{border:1px solid #3a3a3a;padding:9px 14px;border-radius:999px;cursor:pointer;transition:all .2s}
.fm .chips input:checked+span{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.fm .chips input:focus-visible+span{outline:2px solid var(--signal);outline-offset:2px}
.fm .send{grid-column:1/-1;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.fm .msg{font-size:14px;color:var(--mute)}
.fm .hp{position:absolute;left:-9999px}
@media (max-width:860px){.req{grid-template-columns:1fr}.fm{grid-template-columns:1fr}}
/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:#050505;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 48px) 56px calc(env(safe-area-inset-bottom,0px) + 48px)}
.lb img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.lb .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:18px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.lb .x:hover{color:var(--paper)}
.lb .c{position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);font-size:12px;color:var(--mute);letter-spacing:.06em}
.lb .nv{position:absolute;top:0;bottom:0;width:22%;display:flex;align-items:center;font-size:28px;color:var(--mute)}
.lb .nv:hover{color:var(--paper)}
.lb .pv{left:0;justify-content:flex-start;padding-left:16px}.lb .nx{right:0;justify-content:flex-end;padding-right:16px}
@media (max-width:560px){.lb{padding-inline:8px}}
</style>

/* router */
function go(id){location.hash=id}
function render(){
  const h=location.hash.slice(1);
  app.innerHTML="";
  let v,nav="live";
  if(h==="info"||h==="contatti"){v=info();nav="info"}
  else if(h==="servizi"){v=servizi();nav="servizi"}
  else if(h==="ritratti"){v=home("ritratti");nav="ritratti"}
  else if(h==="lavori"){v=home("lavori");nav="lavori"}
  else if(h==="live"){v=home("live")}
  else if(S.some(s=>s.id===h)){v=series(h);const k=S.find(s=>s.id===h).kind;nav=(k==="live"||k==="ritratti")?k:"lavori"}
  else{v=home(null)}
  app.append(v);
  document.querySelectorAll("[data-nav]").forEach(a=>a.toggleAttribute("aria-current",a.dataset.nav===nav&&h!==""));
  document.querySelectorAll("[data-nav]").forEach(a=>{if(a.hasAttribute("aria-current"))a.setAttribute("aria-current","page")});
  window.scrollTo(0,0);
}
addEventListener("hashchange",render);

/* lightbox */
let L=null,LI=0,lastF=null;
function openLB(s,i){L=s;LI=i;lastF=document.activeElement;document.getElementById("lb").hidden=false;document.body.style.overflow="hidden";showLB();document.getElementById("lbX").focus()}
function showLB(){const x=L.im[LI];const img=document.getElementById("lbImg");img.src="f/"+x[0]+".jpg";img.alt=L.t+", foto "+(LI+1);document.getElementById("lbC").textContent=L.t+" — "+pad(LI+1)+" / "+pad(L.im.length)}
function closeLB(){document.getElementById("lb").hidden=true;document.body.style.overflow="";lastF&&lastF.focus()}
const stepLB=n=>{LI=(LI+n+L.im.length)%L.im.length;showLB()};
document.getElementById("lbX").onclick=closeLB;document.getElementById("lbP").onclick=()=>stepLB(-1);document.getElementById("lbN").onclick=()=>stepLB(1);
document.getElementById("lbImg").onclick=closeLB;
addEventListener("keydown",e=>{if(document.getElementById("lb").hidden)return;if(e.key==="Escape")closeLB();if(e.key==="ArrowRight")stepLB(1);if(e.key==="ArrowLeft")stepLB(-1)});
let tx=null;const lb=document.getElementById("lb");lb.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});lb.addEventListener("touchend",e=>{if(tx==null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)stepLB(d<0?1:-1);tx=null});

render();
