<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anteprima impaginazioni — Matteo Barbieri</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif&family=Schibsted+Grotesk:wght@400;500&display=swap">
<style>
:root{--ink:#0a0a0a;--panel:#141414;--hair:#262626;--paper:#ecebe8;--mute:#8a8986;--signal:#e11322;--serif:"Instrument Serif",Georgia,serif;--sans:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;--brand:"Anton",Impact,sans-serif;--gut:clamp(16px,3.2vw,48px);color-scheme:dark}
*{box-sizing:border-box}html,body{background:var(--ink);color:var(--paper);margin:0;font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{padding-inline:var(--gut);max-width:1760px;margin-inline:auto}
.small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--ink) 70%,rgba(10,10,10,0))}
.top .wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding-block:18px 24px}
.logo{font:400 24px/1 var(--brand);display:flex;align-items:center;gap:.28em}.logo i{width:.2em;height:.62em;background:var(--signal);display:inline-block}
.sw{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.sw button{border:1px solid var(--hair);padding:8px 14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);border-radius:999px}
.sw button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.note{border-left:2px solid var(--signal);padding:4px 0 4px 16px;margin:8px 0 40px;max-width:70ch;color:#c9c8c4}
.note b{font:400 28px/1.1 var(--serif);display:block;color:var(--paper);margin-bottom:6px}
.h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--hair);padding-bottom:18px;margin-bottom:28px}
.h h2{font:400 clamp(34px,4vw,56px)/1 var(--serif);margin:0}
img{display:block;width:100%;height:100%;object-fit:cover;background:var(--panel)}
.cap{display:flex;justify-content:space-between;gap:12px;padding-top:10px;align-items:baseline}
.cap b{font:400 24px/1.05 var(--serif)}.cap span{font-size:12px;color:var(--mute);white-space:nowrap}
.cap.big b{font-size:clamp(28px,3vw,44px)}
.it{display:block}.it .ph{overflow:hidden}.it img{transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}.it:hover img{transform:scale(1.03)}
/* 12-col */
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(28px,3vw,48px) clamp(14px,1.6vw,24px)}
.s8{grid-column:span 8}.s4{grid-column:span 4}.r32 .ph{aspect-ratio:3/2}.r34 .ph{aspect-ratio:3/4}.r45 .ph{aspect-ratio:4/5}
@media(max-width:760px){.s8,.s4{grid-column:1/-1}.r34 .ph,.r45 .ph{aspect-ratio:4/5}}
/* list (index) */
.ix{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
.ix li{border-bottom:1px solid var(--hair)}
.ix a{display:grid;grid-template-columns:72px minmax(0,1fr) minmax(0,.9fr) 120px;gap:20px;align-items:center;padding:14px 0}
.ix b{font:400 clamp(26px,3.2vw,48px)/1.05 var(--serif);transition:color .2s}
.ix a:hover b{color:var(--signal)}
.ix .p{color:var(--mute);font-size:14px}.ix .d{font-size:12px;color:var(--mute);letter-spacing:.06em;text-align:right}
.ix .th{width:72px;height:72px}
.ix.big a{grid-template-columns:minmax(0,1fr) minmax(0,.8fr) 140px}
.ix.big b{font-size:clamp(34px,5.4vw,88px);line-height:1}
.ix.big .th{display:none}
@media(max-width:760px){.ix a,.ix.big a{grid-template-columns:72px minmax(0,1fr);gap:4px 14px}.ix .th,.ix.big .th{display:block;grid-row:1/3;grid-column:1}.ix b{grid-column:2}.ix .p{grid-column:2}.ix .d{display:none}.ix.big b{font-size:34px}}
.float{position:fixed;left:0;top:0;width:min(340px,26vw);pointer-events:none;z-index:30;opacity:0;transition:opacity .2s;transform:translate(-50%,-50%)}
.float img{height:auto}
@media(hover:none),(max-width:760px){.float{display:none}}
/* masonry */
.mas{columns:3;column-gap:clamp(14px,1.6vw,24px)}
.mas .it{break-inside:avoid;margin-bottom:clamp(28px,3vw,44px)}
@media(max-width:1000px){.mas{columns:2}}@media(max-width:560px){.mas{columns:1}}
.sub{margin-top:clamp(56px,7vw,100px)}
/* E sfalsata */
.stg{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(14px,1.6vw,24px);row-gap:clamp(40px,6vw,96px)}
.stg .it{align-self:start}
.stg .n{font:400 12px/1 var(--sans);letter-spacing:.1em;color:var(--signal);margin-right:10px}
@media(max-width:760px){.stg .it{grid-column:1/-1!important;margin-top:0!important}.stg .ph{aspect-ratio:4/5!important}}
/* F orizzontale */
.hz{scroll-padding-inline:var(--gut);display:flex;gap:clamp(14px,1.6vw,24px);overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:18px;margin-inline:calc(var(--gut)*-1);padding-inline:var(--gut);scrollbar-width:thin;scrollbar-color:#333 transparent}
.hz .it{flex:0 0 auto;scroll-snap-align:start}
.hz .ph{height:min(66vh,640px)}.hz img{width:auto;height:100%}
.hint{display:flex;justify-content:space-between;margin-top:14px}
.hint button{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);border:1px solid var(--hair);padding:8px 14px;border-radius:999px}
.hint button:hover{color:var(--paper);border-color:var(--paper)}
@media(max-width:760px){.hz{flex-direction:column;overflow:visible;margin-inline:0;padding-inline:0}.hz .ph{height:auto}.hz img{width:100%;height:auto}.hint{display:none}}
/* G schermo intero */
.fs{margin-inline:calc(var(--gut)*-1)}
.fs a{position:relative;display:block;height:min(92vh,1000px);overflow:hidden;border-top:1px solid var(--ink)}
.fs img{position:absolute;inset:0;transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}
.fs a:hover img{transform:scale(1.025)}
.fs a:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.72))}
.fs .tx{position:absolute;left:var(--gut);right:var(--gut);bottom:clamp(20px,4vw,48px);z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.fs .tx b{font:400 clamp(48px,9vw,150px)/.9 var(--serif)}
.fs .tx span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#d8d6d2;text-align:right}
.fs .tx i{font-style:normal;color:var(--signal);display:block;margin-bottom:6px}
@media(max-width:760px){.fs a{height:78vh}.fs .tx span{text-align:left}}
/* H provino */
.ct{background:#050505;border:1px solid var(--hair);padding:clamp(10px,1.4vw,22px);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(18px,1.6vw,26px) clamp(8px,.8vw,12px)}
.ct .it .ph{aspect-ratio:3/2;outline:1px solid #1d1d1d}
.ct .it img{filter:saturate(.95)}
.ct .fr{display:flex;justify-content:space-between;font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:#c48a2c;padding:6px 0 3px}
.ct .nm{font:400 17px/1.15 var(--serif)}
.ct .it.pick .ph{outline:2px solid var(--signal);outline-offset:3px}
.ct .it.pick .fr b{color:var(--signal)}
@media(max-width:1000px){.ct{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.ct{grid-template-columns:repeat(2,minmax(0,1fr))}}
footer{padding:80px var(--gut) 40px;color:var(--mute);font-size:12px}
</style></head><body>
<header class="top"><div class="wrap">
<a class="logo" href="./">MATTEO<i></i>BARBIERI</a>
<div class="sw" role="group" aria-label="Impaginazione">
<button data-v="A">A · Mista</button><button data-v="B">B · Rivista</button><button data-v="C">C · Mosaico</button><button data-v="D">D · Indice nomi</button><button data-v="E">E · Rivista sfalsata</button><button data-v="F">F · Orizzontale</button><button data-v="G">G · Schermo intero</button><button data-v="H">H · Provino</button>
</div></div></header>
<main class="wrap" id="app"></main>
<div class="float" id="fl"><img alt=""></div>
<footer>Anteprima privata, non collegata al sito. Le foto cliccate aprono le serie sul sito vero.</footer>
<script>
const L=[{"id": "elephant-brain", "t": "Elephant Brain", "p": "Locomotiv, Bologna · Harmonya Fest, Alchemica", "d": "2025 — 2026", "c": ["elephant-brain-00", 1800, 1201]}, {"id": "johnny-marr", "t": "Johnny Marr", "p": "Estragon, Bologna", "d": "08.11.2025", "c": ["johnny-marr-00", 1080, 1350]}, {"id": "interpol", "t": "Interpol", "p": "Sequoie Music Park, Bologna", "d": "16.07.2026", "c": ["interpol-00", 1800, 1200]}, {"id": "a-perfect-circle", "t": "A Perfect Circle", "p": "Ferrara Summer Festival", "d": "13.06.2026", "c": ["a-perfect-circle-00", 1800, 1200]}, {"id": "pixies", "t": "Pixies", "p": "Parco della Musica, Milano", "d": "14.07.2026", "c": ["pixies-00", 1800, 1200]}, {"id": "the-zen-circus", "t": "The Zen Circus", "p": "Estragon, Bologna", "d": "12.12.2025", "c": ["the-zen-circus-00", 1800, 1200]}, {"id": "caparezza", "t": "Caparezza", "p": "Sequoie Music Park, Bologna", "d": "08.07.2026", "c": ["caparezza-00", 1800, 1200]}, {"id": "ministri", "t": "Ministri", "p": "Ferrara Sotto le Stelle", "d": "22.07.2026", "c": ["ministri-00", 1800, 1200]}, {"id": "bambole-di-pezza", "t": "Bambole di Pezza", "p": "Estragon, Bologna", "d": "06.05.2026", "c": ["bambole-di-pezza-00", 1200, 1800]}, {"id": "joan-thiele", "t": "Joan Thiele", "p": "Frogstock, Riolo Terme", "d": "20.08.2026", "c": ["joan-thiele-00", 1800, 1200]}, {"id": "marlene-kuntz", "t": "Marlene Kuntz", "p": "Estragon, Bologna · Ferrara Sotto le Stelle", "d": "marzo — luglio 2026", "c": ["marlene-kuntz-00", 1800, 1200]}, {"id": "kneecap", "t": "Kneecap", "p": "Sequoie Music Park, Bologna", "d": "16.06.2026", "c": ["kneecap-00", 1200, 1647]}, {"id": "subsonica", "t": "Subsonica", "p": "Caserme Rosse, Bologna · Festa Reggio", "d": "giugno — settembre 2026", "c": ["subsonica-00", 1200, 1800]}, {"id": "finley", "t": "Finley", "p": "Estragon, Bologna", "d": "15.03.2026", "c": ["finley-00", 1200, 1800]}, {"id": "giorgio-poi", "t": "Giorgio Poi", "p": "Estragon, Bologna", "d": "12.03.2026", "c": ["giorgio-poi-00", 1800, 1440]}, {"id": "jehnny-beth", "t": "Jehnny Beth", "p": "Ferrara Summer Festival", "d": "13.06.2026", "c": ["jehnny-beth-00", 1800, 1200]}, {"id": "of-monsters-and-men", "t": "Of Monsters and Men", "p": "Sequoie Music Park, Bologna", "d": "25.06.2026", "c": ["of-monsters-and-men-00", 1800, 1200]}, {"id": "vulfpeck", "t": "Vulfpeck · The Fearless Flyers", "p": "Parco della Musica, Milano", "d": "13.07.2026", "c": ["vulfpeck-00", 1200, 1800]}];
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,y]of Object.entries(a)){if(x==="class")e.className=y;else e.setAttribute(x,y)}k.forEach(c=>c!=null&&e.append(c));return e};

const href=s=>"./#"+s.id;

const head=(t,n)=>el("div",{class:"h"},el("h2",{},t),el("span",{class:"small"},n));
const note=(t,x)=>el("div",{class:"note"},el("b",{},t),x);

const V={
A(){const f=L.slice(0,4),r=L.slice(4);const w=el("div");
  w.append(note("A · Mista","In alto le 4 serie più forti, grandi. Sotto, tutte le altre in un indice compatto: nome, locale, data e miniatura. Quando aggiungi un concerto entra nell'elenco; se è fortissimo lo sposti in evidenza."));
  w.append(head("Live","In evidenza"));
  const g=el("div",{class:"g12"});
  g.append(item(f[0],"s8 r32",big(f[0]),1),item(f[1],"s4 r34",big(f[1]),1),item(f[3],"s4 r34",big(f[3]),1),item(f[2],"s8 r32",big(f[2]),1));

B(){const w=el("div");w.append(note("B · Rivista","Righe che si alternano come in un magazine: una grande più una verticale, poi al contrario, poi tre uguali. Le prime di ogni gruppo sono le più grandi, quindi l'ordine conta. Con 18 serie lo schema si chiude sempre pieno."));
  w.append(head("Live",L.length+" serie"));const g=el("div",{class:"g12"});let i=0,step=0;
  while(i<L.length){const left=L.length-i;const m=step%3;

C(){const w=el("div");w.append(note("C · Mosaico","Ogni copertina tiene la sua forma originale, verticale o orizzontale, e le colonne si incastrano. Niente tagli e niente caselle spaiate, qualunque sia il numero di serie."));
  w.append(head("Live",L.length+" serie"));const m=el("div",{class:"mas"});
  L.forEach(s=>{const it=item(s,"",sm(s));it.querySelector(".ph").style.aspectRatio=s.c[1]+"/"+s.c[2];m.append(it)});w.append(m);return w},
E(){const w=el("div");w.append(note("E · Rivista sfalsata","Evoluzione della B: stesse foto grandi e piccole, ma posizionate fuori asse, con spazio nero attorno e altezze sfalsate, come un'impaginazione stampata. Ogni tanto una foto da sola al centro fa da pausa. Nessuna casella spaiata, a qualunque numero."));
  w.append(head("Live",L.length+" serie"));const g=el("div",{class:"stg"});
  const P=[[["1/span 7","3/2",0],["9/span 4","4/5","14%"]],[["2/span 4","4/5",0],["7/span 6","3/2","9%"]],[["3/span 8","16/9",0]]];
  let i=0,c=0;while(i<L.length){const row=P[c%3];row.forEach(([col,ar,mt],j)=>{if(i>=L.length)return;const s=L[i++];const big1=ar!=="4/5";const it=item(s,"",big1?big(s):sm(s),big1);it.style.gridColumn=col;it.style.marginTop=mt||0;it.querySelector(".ph").style.aspectRatio=ar;it.querySelector(".cap b").prepend(el("span",{class:"n"},String(i).padStart(2,"0")));g.append(it)});c++}
  w.append(g);return w},
F(){const w=el("div");w.append(note("F · Orizzontale","Da PC le copertine scorrono di lato in una lunga striscia, tutte alla stessa altezza e con la loro forma originale, come i fotogrammi di un rullino. Si scorre con la rotellina, il trackpad o le frecce. Da telefono diventano una colonna verticale."));
  w.append(head("Live",L.length+" serie"));const h=el("div",{class:"hz"});
  L.forEach(s=>{const it=item(s,"",s.c[1]>s.c[2]?big(s):sm(s));it.querySelector(".ph").style.aspectRatio=s.c[1]+"/"+s.c[2];h.append(it)});
  h.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&matchMedia("(min-width:761px)").matches){const max=h.scrollWidth-h.clientWidth;if((e.deltaY>0&&h.scrollLeft<max-2)||(e.deltaY<0&&h.scrollLeft>2)){e.preventDefault();h.scrollLeft+=e.deltaY}}},{passive:false});

  const f=el("div",{class:"fs"});L.forEach((s,i)=>{f.append(el("a",{href:href(s)},el("img",{src:big(s),alt:s.t,loading:i<2?"eager":"lazy",style:s.c[2]>s.c[1]?"object-position:50% 18%":""}),el("div",{class:"tx"},el("b",{},s.t),el("span",{},el("i",{},String(i+1).padStart(2,"0")+" / "+L.length),s.p+" — "+s.d))))});

H(){const w=el("div");w.append(note("H · Provino","Come un foglio provini a contatto: tante copertine piccole in fila, con i numeri di fotogramma, e le serie migliori cerchiate in rosso come si fa con la matita grassa. Si vede tutto il lavoro in un colpo d'occhio; molto 'da fotografo'."));

const app=document.getElementById("app"),fl=document.getElementById("fl");

</script></body></html>
